<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Stages - Portfolio BTS SIO</title>
    <link rel="stylesheet" href="css/base.css?v=7">
    <link rel="stylesheet" href="css/layout.css?v=7">
    <link rel="stylesheet" href="css/components.css?v=7">
    <link rel="stylesheet" href="css/pages.css?v=7">
    <link rel="stylesheet" href="css/responsive.css?v=7">
    <link rel="stylesheet" href="css/stages.css?v=4">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* Cartes de « Mes Stages » : même taille et même mise en forme que celles de « Mes TP » */
        .stage-hub .parcours-grid {
            max-width: 850px;
            gap: 40px;
            margin: 20px auto 40px auto;
        }
        .stage-hub .parcours-card {
            position: relative;
            justify-content: center;
            padding: 2.3rem 2.2rem;
        }
        .stage-hub .parcours-icon {
            position: absolute;
            left: 2.2rem;
            top: 50%;
            width: 66px;
            height: 66px;
            min-width: 0;
            margin-top: -33px;
            padding: 0;
            font-size: 1.9rem;
        }
        .stage-hub .parcours-info {
            flex: 1;
            margin-left: 0;
            padding: 0 5.2rem;
            text-align: center;
        }
        .stage-hub .parcours-info h2 {
            font-size: 1.9rem;
            margin-bottom: 0.6rem;
        }
        .stage-hub .parcours-info p {
            font-size: 1.2rem;
            text-align: center;
        }
        .stage-hub .arrow-indicator {
            position: absolute;
            right: 2.2rem;
            top: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            font-size: 1.4rem;
        }
        @media (max-width: 768px) {
            .stage-hub .parcours-card { padding: 1.8rem 1.2rem; }
            .stage-hub .parcours-icon { left: 1rem; width: 48px; height: 48px; margin-top: -24px; font-size: 1.4rem; }
            .stage-hub .parcours-info { padding: 0 3.6rem; }
            .stage-hub .parcours-info h2 { font-size: 1.5rem; }
            .stage-hub .parcours-info p { font-size: 1.05rem; }
            .stage-hub .arrow-indicator { right: 1rem; }
        }
    </style>
</head>
<body>

    <div class="background-container"></div>

    <div class="main-content">
        <div id="navbar-container"></div>

        <main class="container stage-hub">
            <header class="page-header">
                <h1 class="page-title">Mes Stages</h1>
            </header>

            <div class="parcours-grid">
                <a href="stage_1er_annee.html" class="parcours-card">
                    <div class="parcours-icon"><i class="fa-solid fa-briefcase"></i></div>
                    <div class="parcours-info">
                        <h2>Stage 1ère année</h2>
                        <p>Cliquer pour en savoir plus</p>
                    </div>
                    <i class="fa-solid fa-arrow-right arrow-indicator"></i>
                </a>

                <a href="stage_2eme_annee.html" class="parcours-card">
                    <div class="parcours-icon"><i class="fa-solid fa-network-wired"></i></div>
                    <div class="parcours-info">
                        <h2>Stage 2ème année</h2>
                        <p>Cliquer pour en savoir plus</p>
                    </div>
                    <i class="fa-solid fa-arrow-right arrow-indicator"></i>
                </a>
            </div>

            <!-- Bouton vers le projet (contour arc-en-ciel) -->
            <div class="projet-stages-wrapper">
                <a href="projets.html" class="btn-retour-stages btn-projet-stages">
                    <span>Cliquer pour voir Mon Projet</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </a>
            </div>
        </main>

        <footer class="site-footer">
            <p>&copy; 2026 Arnaud HOLLEBECQUE — Portfolio BTS SIO</p>
        </footer>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
