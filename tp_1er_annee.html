<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP 1ère année - Portfolio BTS SIO</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        .swiper {
            width: 100%;
            max-width: 800px;
            height: 450px;
            border-radius: 16px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            background: rgba(13, 18, 36, 0.85);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin: 20px auto;
        }
        .swiper-slide {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .swiper-slide img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Évite de couper les images de schémas/captures */
            background: #0b0f19;
        }
        .swiper-button-next, .swiper-button-prev {
            color: var(--primary);
        }
        .swiper-pagination-bullet-active {
            background: var(--primary);
        }
    </style>
</head>
<body>

    <div class="background-container"></div>

    <div class="main-content">
        <!-- Barre de navigation dynamique -->
        <div id="navbar-container"></div>

        <!-- Contenu Principal -->
        <main class="container">
            <section class="page-header">
                <h1 class="page-title">TP de 1ère Année</h1>
                <p class="hero-subtitle">Galerie de réalisations et captures de mes travaux pratiques</p>
            </section>

            <!-- Carrousel Swiper.js -->
            <div class="swiper">
                <div class="swiper-wrapper">
                    <!-- Slide 1 -->
                    <div class="swiper-slide">
                        <img src="images/1er_anne_IMAGE VOIP.png" alt="TP VOIP 1">
                    </div>
                    <!-- Slide 2 -->
                    <div class="swiper-slide">
                        <img src="images/1er_annnee_SYNTHESE TP VOIP.png" alt="TP VOIP Synthèse">
                    </div>
                    <!-- Slide 3 -->
                    <div class="swiper-slide">
                        <img src="images/1er_année_image tp_asa_dmz.png" alt="TP ASA DMZ">
                    </div>
                    <!-- Slide 4 -->
                    <div class="swiper-slide">
                        <img src="images/1er_annéee_Fiche_synthèse_ASA_DMZ.png" alt="TP ASA Synthèse">
                    </div>
                    <!-- Slide 5 -->
                    <div class="swiper-slide">
                        <img src="images/1er_annee_image_tp_pfsense.jpg" alt="TP pfSense">
                    </div>
                    <!-- Slide 6 -->
                    <div class="swiper-slide">
                        <img src="images/1er_annee-SYNTH7SE_pfsense.png" alt="TP pfSense Synthèse">
                    </div>
                </div>
                <!-- Boutons de navigation -->
                <div class="swiper-button-next"></div>
                <div class="swiper-button-prev"></div>
                <!-- Pagination -->
                <div class="swiper-pagination"></div>
            </div>

            <!-- Bouton de retour -->
            <div style="text-align: center; margin-top: 30px;">
                <a href="tp.html" class="btn-modern" style="padding: 10px 25px; font-size: 0.9rem;">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Retour aux TP</span>
                </a>
            </div>
        </main>

        <!-- Footer -->
        <footer class="site-footer">
            <p>&copy; 2026 Arnaud HOLLEBECQUE — Portfolio BTS SIO</p>
        </footer>
    </div>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        const swiper = new Swiper('.swiper', {
            loop: true,
            pagination: {
                el: '.swiper-pagination',
                clickable: true,
            },
            navigation: {
                nextEl: '.swiper-button-next',
                prevEl: '.swiper-button-prev',
            },
        });
    </script>
    <script src="js/main.js"></script>
</body>
</html>
