<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Portfolio BTS SIO</title>
    <link rel="stylesheet" href="css/style.css?v=6">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <div class="main-content">
        <div id="navbar-container"></div>

        <main class="container">
            <section class="page-header">
                <h1>Me Contacter</h1>
                <p class="hero-subtitle">N'hésitez pas à me transmettre vos messages</p>
            </section>

            <section class="contact-form-section">
                <form action="https://formspree.io/f/ton_id_formspree" method="POST" class="contact-form">
                    <div class="form-group">
                        <label for="name">Nom / Prénom</label>
                        <input type="text" id="name" name="name" required placeholder="Votre nom">
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required placeholder="Votre adresse email">
                    </div>
                    <div class="form-group">
                        <label for="subject">Sujet</label>
                        <input type="text" id="subject" name="subject" required placeholder="Sujet de votre message">
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5" required placeholder="Votre message..."></textarea>
                    </div>
                    <div class="btn-container">
                        <button type="submit" class="btn-submit">
                            Envoyer le message <i class="fa-solid fa-paper-plane"></i>
                        </button>
                    </div>
                </form>
            </section>
        </main>

        <footer class="site-footer">
            <p>&copy; 2026 Arnaud HOLLEBECQUE — Portfolio BTS SIO</p>
        </footer>
    </div>

    <script src="js/animations.js"></script>
</body>
</html>
