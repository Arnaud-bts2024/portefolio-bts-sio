<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Portfolio BTS SIO</title>
    <link rel="stylesheet" href="./css/style.css?v=25"> 
</head>
<body>

    <div class="background-container"></div>

    <div class="main-content">
        
        <!-- Barre de navigation injectée par JS -->
        <div id="navbar-container"></div>

        <main class="content-container">
            <h1 class="page-title">Me Contacter</h1>
            <p class="hero-subtitle">Une question ou une opportunité ? N'hésitez pas à m'envoyer un message.</p>

            <div class="contact-card">
                <form class="contact-form" action="#" method="POST">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="nom">Nom</label>
                            <input type="text" id="nom" name="nom" placeholder="Votre nom" required>
                        </div>
                        <div class="form-group">
                            <label for="prenom">Prénom</label>
                            <input type="text" id="prenom" name="prenom" placeholder="Votre prénom" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email">Adresse e-mail</label>
                        <input type="email" id="email" name="email" placeholder="votre.email@exemple.com" required>
                    </div>

                    <div class="form-group">
                        <label for="message">Commentaire</label>
                        <textarea id="message" name="message" rows="5" placeholder="Votre commentaire..." required></textarea>
                    </div>

                    <button type="submit" class="btn-modern btn-submit">
                        Envoyer ✈
                    </button>
                </form>
            </div>
        </main>

        <footer class="site-footer">
            <p>© 2026 Arnaud HOLLEBECQUE — Portfolio BTS SIO</p>
        </footer>

    </div>
    <script src="js/main.js"></script>
</body>
</html>
