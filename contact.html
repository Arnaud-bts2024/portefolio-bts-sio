<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Portfolio BTS SIO</title>
    <link rel="stylesheet" href="css/style.css?v=2">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <div class="background-container"></div>

    <div class="main-content">
        <header class="site-header">
            <div class="nav-container">
                <nav class="main-nav">
                    <ul>
                        <li><a href="index.html">Accueil</a></li>
                        <li><a href="bts-sio.html">BTS-SIO</a></li>
                        <li><a href="parcours.html">Parcours</a></li>
                        <li><a href="competences.html">Compétences</a></li>
                        <li><a href="projets.html">Projets</a></li>
                        <li><a href="veille.html">Veille</a></li>
                        <li><a href="contact.html" class="active">Contact</a></li>
                    </ul>
                </nav>
            </div>
        </header>

        <main class="container">
            <section class="page-header">
                <h1>Me Contacter</h1>
                <p class="hero-subtitle">N'hésitez pas à me joindre pour toute opportunité professionnelle</p>
            </section>

            <section class="contact-card">
                <form action="mailto:votre.email@exemple.com" method="post" enctype="text/plain" class="contact-form">
                    <div class="form-group">
                        <label for="name">Nom / Prénom</label>
                        <input type="text" id="name" name="name" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Adresse e-mail</label>
                        <input type="email" id="email" name="email" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5" class="form-control" required></textarea>
                    </div>
                    <button type="submit" class="btn-submit">
                        <i class="fa-solid fa-paper-plane"></i> Envoyer
                    </button>
                </form>
            </section>
        </main>

        <footer class="site-footer">
            <p>&copy; 2026 [PRÉNOM] [NOM] — Portfolio BTS SIO</p>
        </footer>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
