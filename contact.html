<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Portfolio BTS SIO</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Élément pour charger le fond d'écran CSS -->
    <div class="background-container"></div>

    <div class="main-content">
        <header class="site-header">
            <div class="nav-container">
                <nav class="main-nav">
                    <ul>
                        <li><a href="index.html">Accueil</a></li>
                        <li><a href="bts-sio.html">BTS-SIO</a></li>
                        <li><a href="parcours.html">Parcours</a></li>
                        <li><a href="competences.html">Compétences</a></li>
                        <li><a href="projets.html">Projets</a></li>
                        <li><a href="veille techologique.html">Veille</a></li>
                        <li><a href="contact.html" class="active">Contact</a></li>
                    </ul>
                </nav>
            </div>
        </header>

        <main class="container" style="max-width: 800px; margin: 2rem auto; padding: 0 2rem;">
            <section class="page-header" style="margin-bottom: 3rem; text-align: center;">
                <h1>Me Contacter</h1>
                <p class="hero-subtitle">N'hésitez pas à me joindre pour toute opportunité professionnelle</p>
            </section>

            <section style="background: var(--bg-card); border: 1px solid var(--border-color); padding: 2rem; border-radius: 10px;">
                <form action="mailto:votre.email@exemple.com" method="post" enctype="text/plain" style="display: flex; flex-direction: column; gap: 1.5rem;">
                    <div>
                        <label for="name" style="display: block; margin-bottom: 0.5rem; color: var(--text-main);">Nom / Prénom</label>
                        <input type="text" id="name" name="name" required style="width: 100%; padding: 0.75rem; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-secondary); color: var(--text-main);">
                    </div>
                    <div>
                        <label for="email" style="display: block; margin-bottom: 0.5rem; color: var(--text-main);">Adresse e-mail</label>
                        <input type="email" id="email" name="email" required style="width: 100%; padding: 0.75rem; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-secondary); color: var(--text-main);">
                    </div>
                    <div>
                        <label for="message" style="display: block; margin-bottom: 0.5rem; color: var(--text-main);">Message</label>
                        <textarea id="message" name="message" rows="5" required style="width: 100%; padding: 0.75rem; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-secondary); color: var(--text-main);"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary" style="align-self: flex-start; cursor: pointer;"><i class="fa-solid fa-paper-plane"></i> Envoyer</button>
                </form>
            </section>
        </main>

        <footer class="site-footer">
            <div class="footer-container">
                <p>&copy; 2026 [PRÉNOM] [NOM] — Portfolio BTS SIO</p>
            </div>
        </footer>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
