<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Portfolio BTS SIO</title>
    <link rel="stylesheet" href="css/style.css?v=20">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <div class="background-container"></div>

    <div class="main-content">
        <!-- Navbar injectée via JS -->
        <div id="navbar-container"></div>

        <main class="container">
            <h1 class="page-title">Me Contacter</h1>
            <p class="hero-subtitle">Une question ou une opportunité ? N'hésitez pas à m'envoyer un message ou prendre rendez-vous.</p>

            <section class="contact-form-section">
                <form action="#" method="POST" class="contact-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="nom">Nom</label>
                            <input type="text" id="nom" name="nom" placeholder="Votre nom" required>
                        </div>
                        <div class="form-group">
                            <label for="prenom">Prénom</label>
                            <input type="text" id="prenom" name="prenom" placeholder="Votre prénom" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email">Adresse e-mail</label>
                        <input type="email" id="email" name="email" placeholder="votre.email@exemple.com" required>
                    </div>

                    <div class="form-group">
                        <label for="message">Commentaire</label>
                        <textarea id="message" name="message" placeholder="Votre commentaire..." required></textarea>
                    </div>

                    <div class="btn-container">
                        <button type="submit" class="btn-submit">
                            Envoyer <i class="fa-solid fa-paper-plane"></i>
                        </button>
                    </div>
                </form>
            </section>

            <!-- Bouton de prise de rendez-vous -->
            <div class="booking-section">
                <a href="#" class="btn-booking" target="_blank" rel="noopener noreferrer">
                    Prendre un rendez-vous <i class="fa-solid fa-calendar-days"></i>
                </a>
            </div>
        </main>

        <footer class="site-footer">
            <p>&copy; 2026 Arnaud HOLLEBECQUE — Portfolio BTS SIO</p>
        </footer>
    </div>

    <script src="js/main.js?v=2"></script>
    <script src="js/animations.js"></script>
</body>
</html>
