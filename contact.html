<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Portfolio</title>
    <link rel="stylesheet" href="css/style.css?v=7">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="page-contact">

    <div class="background-container"></div>

    <div class="main-content">
        <!-- Navbar injectée via JS -->
        <div id="navbar-container"></div>

        <main class="container">
            <section class="page-header">
                <h1>Me Contacter</h1>
                <p class="hero-subtitle">Une question ou une opportunité ? N'hésitez pas à m'envoyer un message ou prendre rendez-vous.</p>
            </section>

            <section class="contact-form-section">
                <form class="contact-form" action="#" method="POST">
                    <div class="form-group">
                        <label for="name">Nom / Prénom</label>
                        <input type="text" id="name" name="name" placeholder="Votre nom" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Adresse E-mail</label>
                        <input type="email" id="email" name="email" placeholder="votre.email@exemple.com" required>
                    </div>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" placeholder="Votre message..." required></textarea>
                    </div>

                    <div class="btn-container">
                        <button type="submit" class="btn-submit">
                            Envoyer <i class="fa-solid fa-paper-plane"></i>
                        </button>
                    </div>
                </form>
            </section>

            <!-- Bouton vers l'agenda Google -->
            <section class="booking-section">
                <a href="https://calendar.app.google/jHNjbFMhdt6eRt1P6" 
                   target="_blank" 
                   rel="noopener noreferrer" 
                   class="btn-submit btn-booking">
                    Prendre un rendez-vous <i class="fa-solid fa-calendar-days"></i>
                </a>
            </section>
        </main>

        <footer class="site-footer">
            <p>&copy; 2026 Arnaud HOLLEBECQUE — Portfolio BTS SIO</p>
        </footer>
    </div>

    <script src="js/main.js?v=7"></script>
</body>
</html>
