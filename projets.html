<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Projet - Portfolio BTS SIO</title>
    <link rel="stylesheet" href="css/base.css?v=7">
    <link rel="stylesheet" href="css/layout.css?v=7">
    <link rel="stylesheet" href="css/components.css?v=7">
    <link rel="stylesheet" href="css/pages.css?v=7">
    <link rel="stylesheet" href="css/responsive.css?v=7">
    <link rel="stylesheet" href="css/projet.css?v=3">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <div class="background-container"></div>

    <div class="main-content">
        <div id="navbar-container"></div>

        <main class="container">
            <section class="page-header">
                <h1>Mon Projet</h1>
                <p class="hero-subtitle">Découvrez mon projet de BTS SIO</p>
            </section>

            <div class="projet-grid">

                <!-- Bouton 1 : ouvre le document PDF du projet -->
                <a href="documents/projet/projet.pdf" target="_blank" rel="noopener noreferrer" class="project-card">
                    <h2>
                        <i class="fa-solid fa-diagram-project"></i> Mon Projet : Nom du projet
                        <i class="fa-solid fa-arrow-up-right-from-square card-arrow"></i>
                    </h2>

                    <div class="project-tags">
                        <span>PHP</span>
                        <span>MySQL</span>
                        <span>JavaScript</span>
                    </div>

                    <p>Description globale du projet, des objectifs et des résultats obtenus.</p>
                </a>

                <!-- Bouton 2 : image du projet (apparaît après 1 s, s'agrandit au clic) -->
                <a href="images/projet/projet.png" class="project-card project-image-card" id="projectImgLink">
                    <h2><i class="fa-solid fa-image"></i> Schéma du projet</h2>
                    <img src="images/projet/projet.png" alt="Schéma de mon projet">
                    <p class="image-hint"><i class="fa-solid fa-magnifying-glass-plus"></i> Clique pour agrandir</p>
                </a>

            </div>
        </main>

        <footer class="site-footer">
            <p>&copy; 2026 Arnaud HOLLEBECQUE — Portfolio BTS SIO</p>
        </footer>
    </div>

    <!-- Agrandissement de l'image (hors des cartes) -->
    <div class="lightbox" id="lightbox">
        <img src="" alt="Schéma de mon projet en grand">
    </div>

    <script src="js/main.js"></script>
    <script>
        // Effet spotlight qui suit la souris
        document.querySelectorAll(".project-card").forEach(card => {
            card.addEventListener("mousemove", e => {
                const rect = card.getBoundingClientRect();
                card.style.setProperty("--mx", (e.clientX - rect.left) + "px");
                card.style.setProperty("--my", (e.clientY - rect.top) + "px");
            });
        });

        // Agrandissement de l'image au clic sur le 2e bouton
        const lightbox = document.getElementById("lightbox");
        const lightboxImg = lightbox.querySelector("img");

        document.getElementById("projectImgLink").addEventListener("click", e => {
            e.preventDefault();
            lightboxImg.src = e.currentTarget.getAttribute("href");
            lightbox.classList.add("open");
        });

        lightbox.addEventListener("click", () => lightbox.classList.remove("open"));

        document.addEventListener("keydown", e => {
            if (e.key === "Escape") lightbox.classList.remove("open");
        });
    </script>
</body>
</html>
