<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Projet - Portfolio BTS SIO</title>
    <link rel="stylesheet" href="css/style.css?v=11">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* Grille centrée et largeur optimisée pour harmoniser avec les TP */
        .projet-grid {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            margin: 30px auto;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="background-container"></div>

    <div class="main-content">
        <!-- Navbar injectée via JS -->
        <div id="navbar-container"></div>

        <main class="container">
            <section class="page-header">
                <h1>Mon Projet</h1>
                <p class="hero-subtitle">Découvrez mon projet de BTS SIO</p>
            </section>

            <!-- Grille des Projets -->
            <div class="projet-grid">
                <article class="project-card">
                    <div class="project-card-inner">
                        <h2><i class="fa-solid fa-diagram-project"></i> Mon Projet : Nom du projet</h2>

                        <div class="project-tags">
                            <span>PHP</span>
                            <span>MySQL</span>
                            <span>JavaScript</span>
                        </div>

                        <p>Description globale du projet, des objectifs et des résultats obtenus.</p>
                    </div>
                </article>
            </div>
        </main>

        <footer class="site-footer">
            <p>&copy; 2026 Arnaud HOLLEBECQUE — Portfolio BTS SIO</p>
        </footer>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
