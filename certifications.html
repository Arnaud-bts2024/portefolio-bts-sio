<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Certifications - Portfolio BTS SIO</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Bibliothèque PageFlip -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

    <style>
        /* ---------- Page sans scroll ---------- */
        html, body { height: 100%; overflow: hidden; }

        .main-content {
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        main.container {
            flex: 1;
            min-height: 0;
            padding: 0.4rem 1rem 0.6rem 1rem;
        }

        .page-header { margin-bottom: 0.2rem; }
        main h1.page-title { margin-top: 4px; font-size: 1.6rem; }
        .page-header .hero-subtitle { margin-top: 2px; font-size: 0.85rem; }

        @media (max-height: 700px) {
            .page-header .hero-subtitle { display: none; }
        }

        /* ---------- Livre ---------- */
        .reader-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* La hauteur est fixée en pixels par le JavaScript */
        .book-viewport {
            width: 100%;
            height: 450px;
            position: relative;
            flex: none;
            overflow: hidden;          /* CORRECTIF : le livre ne déborde plus sur les boutons */
        }

        #book { width: 100%; height: 100%; }

        .page {
            background-color: #ffffff;
            overflow: hidden;
        }

        .page img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            pointer-events: none;
            user-select: none;
        }

        #error-box {
            display: none;
            max-width: 700px;
            margin: 20px auto;
            padding: 14px 18px;
            background: rgba(120, 20, 20, 0.85);
            border: 1.5px solid #ff6b6b;
            border-radius: 10px;
            color: #fff;
            font-size: 0.9rem;
            text-align: left;
        }

        /* ---------- Contrôles ---------- */
        .reader-controls {
            position: relative;        /* CORRECTIF : les boutons passent au-dessus du livre */
            z-index: 50;               /* CORRECTIF */
            flex-shrink: 0;
            margin-top: 10px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            align-items: center;
        }

        .btn-page {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 18px;
            background: rgba(13, 22, 48, 0.85);
            border: 1.5px solid var(--primary);
            color: var(--text-main);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .btn-page:hover {
            background: var(--primary);
            color: #0f172a;
            box-shadow: 0 0 15px var(--glow-color);
        }

        #page-info {
            color: var(--text-muted);
            font-size: 0.9rem;
