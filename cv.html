<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon CV - Arnaud Hollebecque</title>
    <link rel="stylesheet" href="css/style.css?v=6">
    <style>
        .cv-page {
            min-height: 100vh;
            padding: 110px 20px 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(135deg, #e8f1fb 0%, #f4f8fd 45%, #dfeaf7 100%);
            position: relative;
            overflow: hidden;
        }
        .cv-page::before,
        .cv-page::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            opacity: .45;
            z-index: 0;
        }
        .cv-page::before { width: 420px; height: 420px; background: #9cc3f0; top: -120px; left: -120px; }
        .cv-page::after  { width: 380px; height: 380px; background: #b7d9f5; bottom: -100px; right: -100px; }

        .cv-header, .cv-viewer, .cv-actions { position: relative; z-index: 1; }

        .cv-header { text-align: center; margin-bottom: 24px; }
        .cv-header h1 { margin: 0 0 6px; font-size: 2rem; color: #1b3a5c; }
        .cv-header p  { margin: 0; color: #4a6785; }

        .cv-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-bottom: 22px; }
        .cv-btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 11px 22px; border-radius: 999px;
            font-weight: 600; text-decoration: none;
            transition: transform .2s ease, box-shadow .2s ease;
        }
        .cv-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(27, 58, 92, .2); }
        .cv-btn-primary { background: #1b6fd1; color: #fff; }
        .cv-btn-secondary { background: #fff; color: #1b6fd1; border: 2px solid #1b6fd1; }

        .cv-viewer {
            width: 70%;
            max-width: 900px;
            min-width: 300px;
            height: 80vh;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 18px 50px rgba(27, 58, 92, .25);
            overflow: hidden;
        }
        .cv-viewer iframe, .cv-viewer object { width: 100%; height: 100%; border: 0; display: block; }
        .cv-fallback { padding: 40px; text-align: center; color: #1b3a5c; }

        @media (max-width: 768px) {
            .cv-viewer { width: 95%; height: 70vh; }
        }
    </style>
</head>
<body>
    <div id="background-container"></div>
    <div id="navbar-container"></div>

    <main class="cv-page">
        <header class="cv-header">
            <h1>Mon CV</h1>
            <p>Arnaud Hollebecque — BTS SIO option SISR</p>
        </header>

        <div class="cv-actions">
            <a class="cv-btn cv-btn-primary" href="documents/cv.pdf" download="CV-Arnaud-Hollebecque.pdf">⬇ Télécharger mon CV</a>
            <a class="cv-btn cv-btn-secondary" href="documents/cv.pdf" target="_blank" rel="noopener">Ouvrir dans un nouvel onglet</a>
        </div>

        <div class="cv-viewer">
            <object data="documents/cv.pdf#toolbar=0&navpanes=0" type="application/pdf">
                <div class="cv-fallback">
                    <p>Votre navigateur ne peut pas afficher le PDF.</p>
                    <a class="cv-btn cv-btn-primary" href="documents/cv.pdf" download>Télécharger le CV</a>
                </div>
            </object>
        </div>
    </main>

    <script src="js/main.js"></script>
    <script src="js/animations.js"></script>
</body>
</html>
