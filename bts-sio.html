<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTS SIO - Portfolio</title>
    <link rel="stylesheet" href="css/style.css?v=2">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <div class="background-container"></div>

    <div class="main-content">
        <header class="site-header">
            <div class="nav-container">
                <!-- Le menu unique sera injecté ici -->
                <div id="navbar-container"></div>
            </div>
        </header>

        <main class="container">
            <section class="page-header">
                <h1>Le BTS SIO</h1>
                <p class="hero-subtitle">Services Informatiques aux Organisations</p>
            </section>
        </main>

        <footer class="site-footer">
            <p>&copy; 2026 Arnaud HOLLEBECQUE — Portfolio BTS SIO</p>
        </footer>
    </div>

    <!-- Script qui charge le fichier navbar.html -->
    <script>
        fetch('navbar.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('navbar-container').innerHTML = data;
            });
    </script>
    <script src="js/main.js"></script>
</body>
</html>
