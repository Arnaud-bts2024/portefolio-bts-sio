<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP 2eme année - Portfolio BTS SIO</title>
    <link rel="stylesheet" href="css/base.css?v=7">
    <link rel="stylesheet" href="css/layout.css?v=7">
    <link rel="stylesheet" href="css/components.css?v=7">
    <link rel="stylesheet" href="css/pages.css?v=7">
    <link rel="stylesheet" href="css/responsive.css?v=7">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        .swiper {
            width: 100%;
            max-width: 900px;
            height: 480px;
            border-radius: 16px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            background: rgba(13, 18, 36, 0.85);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin: 15px auto;
            position: relative;
        }
        .swiper-slide {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .swiper-slide img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #0b0f19;
            cursor: pointer;
        }
        .zoom-btn {
            position: absolute;
            bottom: 15px;
            right: 15px;
            background: rgba(11, 15, 25, 0.85);
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            z-index: 10;
        }
        .zoom-btn:hover {
            background: var(--primary);
            color: #0b0f19;
            transform: scale(1.05);
        }
        .swiper-button-next, .swiper-button-prev {
            color: var(--primary);
        }
        .swiper-pagination-bullet-active {
            background: var(--primary);
        }

        .modal-zoom {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: rgba(11, 15, 25, 0.95);
            backdrop-filter: blur(10px);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-zoom.active {
            display: flex;
        }
        .modal-zoom img {
            max-width: 90%;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 12px;
            border: 2px solid var(--primary);
            box-shadow: 0 0 40px rgba(0, 210, 255, 0.5);
        }
        .modal-close {
            position: absolute;
            top: 25px;
            right: 35px;
            color: #ffffff;
            font-size: 2.5rem;
            cursor: pointer;
            transition: color 0.3s ease;
        }
        .modal-close:hover {
            color: var(--primary);
        }
    </style>
</head>
<body>

    <div class="background-container"></div>

    <div class="main-content">
        <div id="navbar-container"></div>

        <main class="container">
            <section class="page-header">
                <h1 class="page-title">TP de 2eme Année</h1>
                <p class="hero-subtitle">Galerie de réalisations et captures de mes travaux pratiques</p>
            </section>

            <!-- Carrousel Swiper.js -->
            <div class="swiper">
                <div class="swiper-wrapper">
                    <div class="swiper-slide">
                        <img src="images/2eme_annee_image_ospf.jpg" alt="tp ospf" onclick="openZoom(this.src)">
                        <button class="zoom-btn" onclick="openZoom(this.previousElementSibling.src)"><i class="fa-solid fa-magnifying-glass-plus"></i> Zoom</button>
                    </div>
                    <div class="swiper-slide">
                        <img src="images/2eme_annee_sythèse_ospf.jpg" alt="tp ospf synthèse" onclick="openZoom(this.src)">
                        <button class="zoom-btn" onclick="openZoom(this.previousElementSibling.src)"><i class="fa-solid fa-magnifying-glass-plus"></i> Zoom</button>
                    </div>
                    <div class="swiper-slide">
                        <img src="images/2eme_annee_image_HSRP.png" alt="tp hsrp" onclick="openZoom(this.src)">
                        <button class="zoom-btn" onclick="openZoom(this.previousElementSibling.src)"><i class="fa-solid fa-magnifying-glass-plus"></i> Zoom</button>
                    </div>
                    <div class="swiper-slide">
                        <img src="images/2eme_annee_synthèse_HSRP.png" alt="tp hsrp synthèse" onclick="openZoom(this.src)">
                        <button class="zoom-btn" onclick="openZoom(this.previousElementSibling.src)"><i class="fa-solid fa-magnifying-glass-plus"></i> Zoom</button>
                    </div> 
                </div>

                <div class="swiper-button-next"></div>
                <div class="swiper-button-prev"></div>
                <div class="swiper-pagination"></div>
            </div>

            <div style="text-align: center; margin-top: 20px;">
                <a href="tp.html" class="btn-modern" style="padding: 10px 25px; font-size: 0.9rem;">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Retour aux TP</span>
                </a>
            </div>
        </main>

        <footer class="site-footer">
            <p>&copy; 2026 Arnaud HOLLEBECQUE — Portfolio BTS SIO</p>
        </footer>
    </div>

    <!-- Modale de Zoom -->
    <div class="modal-zoom" id="imageModal" onclick="closeZoom()">
        <span class="modal-close">&times;</span>
        <img id="modalImg" src="" alt="Zoom image">
    </div>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        const swiper = new Swiper('.swiper', {
            loop: true,
            pagination: { el: '.swiper-pagination', clickable: true },
            navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev' },
        });

        function openZoom(src) {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImg');
            modalImg.src = src;
            modal.classList.add('active');
        }

        function closeZoom() {
            document.getElementById('imageModal').classList.remove('active');
        }
    </script>
    <script src="js/main.js"></script>
</body>
</html>
