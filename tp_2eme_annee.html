<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP 2eme année - Portfolio BTS SIO</title>
    <link rel="stylesheet" href="css/base.css?v=7">
    <link rel="stylesheet" href="css/layout.css?v=7">
    <link rel="stylesheet" href="css/components.css?v=7">
    <link rel="stylesheet" href="css/pages.css?v=7">
    <link rel="stylesheet" href="css/responsive.css?v=7">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        .swiper {
            width: 100%;
            max-width: 900px;
            height: 480px;
            border-radius: 16px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            background: rgba(13, 18, 36, 0.85);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin: 15px auto;
            position: relative;
        }
        .swiper-slide {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .swiper-slide img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #0b0f19;
            cursor: pointer;
        }
        .zoom-btn {
            position: absolute;
            bottom: 15px;
            right: 15px;
            background: rgba(11, 15, 25, 0.85);
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            z-index: 10;
        }
        .zoom-btn:hover {
            background: var(--primary);
            color: #0b0f19;
            transform: scale(1.05);
        }
        .swiper-button-next, .swiper-button-prev {
            color: var(--primary);
        }
        .swiper-pagination-bullet-active {
            background: var(--primary);
        }

        /* Fenêtre Modale pour le Zoom Plein Écran */
        .modal-zoom {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: rgba(11, 15, 25, 0.95);
            backdrop-filter: blur(10px);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-zoom.active {
            display: flex;
        }
        .zoom-stage {
            width: 82vw;
            height: 86vh;
            overflow: auto;
            display: flex;
            border-radius: 12px;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) transparent;
        }
        .zoom-stage.is-zoomed { cursor: grab; }
        .zoom-stage.dragging { cursor: grabbing; user-select: none; }
        .zoom-stage img {
            margin: auto;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            box-sizing: border-box;
            border-radius: 12px;
            border: 2px solid var(--primary);
            box-shadow: 0 0 40px rgba(0, 210, 255, 0.5);
            -webkit-user-drag: none;
        }
        .zoom-stage img.zoomed { max-width: none; max-height: none; flex: none; }

        /* Flèches pour passer d'une image à l'autre en restant en zoom */
        .zoom-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 52px;
            height: 52px;
            display: grid;
            place-items: center;
            font-size: 1.2rem;
            color: var(--primary);
            background: rgba(11, 15, 25, 0.85);
            border: 1.5px solid var(--primary);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 2;
        }
        .zoom-nav:hover {
            background: var(--primary);
            color: #0b0f19;
            box-shadow: 0 0 18px var(--glow-color);
        }
        .zoom-nav.prev { left: 25px; }
        .zoom-nav.next { right: 25px; }

        /* Boutons « Zoom + » et « Zoom - » (en haut à droite) */
        .zoom-tools {
            position: absolute;
            top: 22px;
            right: 30px;
            display: flex;
            gap: 10px;
            z-index: 3;
        }
        .zoom-exit, .zoom-in {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            font-size: 0.95rem;
            font-weight: 700;
            color: #ffffff;
            background: rgba(11, 15, 25, 0.85);
            border: 1.5px solid var(--primary);
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 2;
        }
        .zoom-exit:hover, .zoom-in:hover:not(:disabled) {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            border-color: transparent;
            box-shadow: 0 0 20px var(--glow-color);
        }

        .zoom-in:disabled { opacity: 0.4; cursor: not-allowed; }

        .zoom-counter {
            position: absolute;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        @media (max-width: 768px) {
            .zoom-stage { width: 100%; height: 78vh; }
            .zoom-nav { width: 42px; height: 42px; }
            .zoom-nav.prev { left: 8px; }
            .zoom-nav.next { right: 8px; }
            .zoom-tools { right: 12px; }
            .zoom-exit, .zoom-in { padding: 8px 14px; }
        }
    </style>
</head>
<body>

    <div class="background-container"></div>

    <div class="main-content">
        <div id="navbar-container"></div>

        <main class="container">
            <section class="page-header">
                <h1 class="page-title">TP de 2eme Année</h1>
                <p class="hero-subtitle">Galerie de réalisations et captures de mes travaux pratiques</p>
            </section>

            <!-- Carrousel Swiper.js -->
            <div class="swiper">
                <div class="swiper-wrapper">
                    <div class="swiper-slide">
                        <img src="images/2eme_annee_image_ospf.jpg" alt="tp ospf" onclick="openZoom(this.src)">
                        <button class="zoom-btn" onclick="openZoom(this.previousElementSibling.src)"><i class="fa-solid fa-magnifying-glass-plus"></i> Zoom</button>
                    </div>
                    <div class="swiper-slide">
                        <img src="images/2eme_annee_sythèse_ospf.jpg" alt="tp ospf synthèse" onclick="openZoom(this.src)">
                        <button class="zoom-btn" onclick="openZoom(this.previousElementSibling.src)"><i class="fa-solid fa-magnifying-glass-plus"></i> Zoom</button>
                    </div>
                    <div class="swiper-slide">
                        <img src="images/2eme_annee_image_HSRP.png" alt="tp hsrp" onclick="openZoom(this.src)">
                        <button class="zoom-btn" onclick="openZoom(this.previousElementSibling.src)"><i class="fa-solid fa-magnifying-glass-plus"></i> Zoom</button>
                    </div>
                    <div class="swiper-slide">
                        <img src="images/2eme_annee_synthèse_HSRP.png" alt="tp hsrp synthèse" onclick="openZoom(this.src)">
                        <button class="zoom-btn" onclick="openZoom(this.previousElementSibling.src)"><i class="fa-solid fa-magnifying-glass-plus"></i> Zoom</button>
                    </div>
                </div>

                <div class="swiper-button-next"></div>
                <div class="swiper-button-prev"></div>
                <div class="swiper-pagination"></div>
            </div>

            <div style="text-align: center; margin-top: 20px;">
                <a href="tp.html" class="btn-modern" style="padding: 10px 25px; font-size: 0.9rem;">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Retour aux TP</span>
                </a>
            </div>
        </main>

        <footer class="site-footer">
            <p>&copy; 2026 Arnaud HOLLEBECQUE — Portfolio BTS SIO</p>
        </footer>
    </div>

    <!-- Modale de Zoom : on reste en zoom, flèches pour changer d'image, « Zoom - » pour quitter -->
    <div class="modal-zoom" id="imageModal">
        <button type="button" class="zoom-nav prev" id="zoomPrev" title="Image précédente"><i class="fa-solid fa-chevron-left"></i></button>
        <div class="zoom-stage" id="zoomStage"><img id="modalImg" src="" alt="Zoom image"></div>
        <button type="button" class="zoom-nav next" id="zoomNext" title="Image suivante"><i class="fa-solid fa-chevron-right"></i></button>
        <div class="zoom-tools">
            <button type="button" class="zoom-in" id="zoomIn" title="Agrandir (touche +)"><i class="fa-solid fa-magnifying-glass-plus"></i> Zoom +</button>
            <button type="button" class="zoom-exit" id="zoomExit" title="Réduire, puis quitter le zoom (Échap)"><i class="fa-solid fa-magnifying-glass-minus"></i> Zoom -</button>
        </div>
        <div class="zoom-counter" id="zoomCounter"></div>
    </div>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        // Liste des images, relevée AVANT l'initialisation de Swiper (le mode loop duplique les slides)
        const slideImages = Array.from(document.querySelectorAll('.swiper-slide img'))
            .map(img => ({ src: img.src, alt: img.alt }));

        const swiper = new Swiper('.swiper', {
            loop: true,
            pagination: { el: '.swiper-pagination', clickable: true },
            navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev' },
        });

        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImg');
        const counter = document.getElementById('zoomCounter');
        let current = 0;

        function showZoom(index) {
            current = Math.max(0, Math.min(index, slideImages.length - 1));
            document.getElementById('zoomPrev').style.visibility = current === 0 ? 'hidden' : 'visible';
            modalImg.src = slideImages[current].src;
            modalImg.alt = slideImages[current].alt;
            counter.textContent = (current + 1) + ' / ' + slideImages.length;
            resetScale();
        }

        // ----- Zoom + / Zoom - : agrandissement par paliers, image déplaçable à la souris -----
        const stage = document.getElementById('zoomStage');
        const zoomInBtn = document.getElementById('zoomIn');
        const SCALES = [1, 1.5, 2, 3, 4];
        let scaleIdx = 0, baseW = 0, baseH = 0;

        function setScale(idx) {
            // garde le même point au centre de l'écran pendant le zoom
            const cx = (stage.scrollLeft + stage.clientWidth / 2) / (stage.scrollWidth || 1);
            const cy = (stage.scrollTop + stage.clientHeight / 2) / (stage.scrollHeight || 1);
            scaleIdx = idx;
            const s = SCALES[scaleIdx];
            if (s === 1) {
                modalImg.classList.remove('zoomed');
                modalImg.style.width = '';
                modalImg.style.height = '';
            } else {
                modalImg.classList.add('zoomed');
                modalImg.style.width = (baseW * s) + 'px';
                modalImg.style.height = (baseH * s) + 'px';
            }
            stage.classList.toggle('is-zoomed', s > 1);
            zoomInBtn.disabled = scaleIdx === SCALES.length - 1;
            stage.scrollLeft = cx * stage.scrollWidth - stage.clientWidth / 2;
            stage.scrollTop = cy * stage.scrollHeight - stage.clientHeight / 2;
        }
        function resetScale() { setScale(0); stage.scrollTo(0, 0); }
        function zoomIn() {
            if (scaleIdx >= SCALES.length - 1) return;
            if (scaleIdx === 0) { baseW = modalImg.offsetWidth; baseH = modalImg.offsetHeight; }
            setScale(scaleIdx + 1);
        }
        // « Zoom - » : réduit d'un palier, puis quitte le zoom une fois revenu à la taille normale
        function zoomOut() {
            if (scaleIdx > 0) setScale(scaleIdx - 1);
            else closeZoom();
        }

        // Déplacer l'image agrandie en la faisant glisser
        let drag = null;
        stage.addEventListener('pointerdown', e => {
            if (scaleIdx === 0 || e.pointerType === 'touch') return;
            drag = { x: e.clientX, y: e.clientY, l: stage.scrollLeft, t: stage.scrollTop };
            stage.setPointerCapture(e.pointerId);
            stage.classList.add('dragging');
        });
        stage.addEventListener('pointermove', e => {
            if (!drag) return;
            stage.scrollLeft = drag.l - (e.clientX - drag.x);
            stage.scrollTop = drag.t - (e.clientY - drag.y);
        });
        const endDrag = () => { drag = null; stage.classList.remove('dragging'); };
        stage.addEventListener('pointerup', endDrag);
        stage.addEventListener('pointercancel', endDrag);

        function openZoom(src) {
            const index = slideImages.findIndex(s => s.src === src);
            showZoom(index >= 0 ? index : 0);
            modal.classList.add('active');
        }

        function closeZoom(target = current) {
            modal.classList.remove('active');
            swiper.slideToLoop(target); // par défaut le carrousel se place sur l'image vue en dernier
        }

        // Dernière image : « suivant » quitte le zoom et le carrousel revient à la première image
        function goNext() {
            if (current >= slideImages.length - 1) closeZoom(0);
            else showZoom(current + 1);
        }
        function goPrev() {
            if (current > 0) showZoom(current - 1);
        }

        document.getElementById('zoomPrev').addEventListener('click', goPrev);
        document.getElementById('zoomNext').addEventListener('click', goNext);
        zoomInBtn.addEventListener('click', zoomIn);
        document.getElementById('zoomExit').addEventListener('click', zoomOut);

        document.addEventListener('keydown', e => {
            if (!modal.classList.contains('active')) return;
            if (e.key === 'Escape') closeZoom();
            else if (e.key === 'ArrowLeft') goPrev();
            else if (e.key === 'ArrowRight') goNext();
            else if (e.key === '+' || e.key === '=') zoomIn();
            else if (e.key === '-' && scaleIdx > 0) zoomOut();
        });
    </script>
    <script src="js/main.js"></script>
</body>
</html>
