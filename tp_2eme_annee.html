<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP 2eme année - Portfolio BTS SIO</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        html, body {
            height: 100%;
            overflow: hidden; /* Empêche tout scroll global de la page */
        }
        .main-content {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0.5rem 1rem;
        }
        .page-header {
            margin-bottom: 0.5rem;
        }
        .page-title {
            font-size: 1.8rem;
            margin-top: 5px;
        }
        .hero-subtitle {
            font-size: 0.85rem;
            margin-top: 2px;
        }
        .swiper {
            width: 100%;
            max-width: 1300px;
            height: 52vh; /* Hauteur ajustée pour un affichage 100% sans scroll */
            border-radius: 14px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            background: rgba(13, 18, 36, 0.85);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin: 10px auto;
        }
        .swiper-slide {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .swiper-slide img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #0b0f19;
        }
        .swiper-button-next, .swiper-button-prev {
            color: var(--primary);
        }
        .swiper-pagination-bullet-active {
            background: var(--primary);
        }
    </style>
</head>
<body>

    <div class="background-container"></div>

    <div class="main-content">
        <!-- Barre de navigation dynamique -->
        <div id="navbar-container"></div>

        <!-- Contenu Principal -->
        <main class="container" style="max-width: 95%; width: 100%;">
            <section class="page-header">
                <h1 class="page-title">TP de 2eme Année</h1>
                <p class="hero-subtitle">Galerie de réalisations et captures de mes travaux pratiques</p>
            </section>

            <!-- Carrousel Swiper.js -->
            <div class="swiper">
                <div class="swiper-wrapper">
                    <!-- Slide 1 -->
                    <div class="swiper-slide">
                        <img src="images/2eme_annee_image_ospf.jpg" alt="tp ospf">
                    </div>
                    <!-- Slide 2 -->
                    <div class="swiper-slide">
                        <img src="images/2eme_annee_sythèse_ospf.jpg" alt="tp ospf synthèse">
                    </div>
                </div>

                <!-- Boutons de navigation -->
                <div class="swiper-button-next"></div>
                <div class="swiper-button-prev"></div>
                <!-- Pagination -->
                <div class="swiper-pagination"></div>
            </div>

            <!-- Bouton de retour -->
            <div style="text-align: center; margin-top: 10px;">
                <a href="tp.html" class="btn-modern" style="padding: 8px 20px; font-size: 0.85rem;">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Retour aux TP</span>
                </a>
            </div>
        </main>

        <!-- Footer -->
        <footer class="site-footer">
            <p>&copy; 2026 Arnaud HOLLEBECQUE — Portfolio BTS SIO</p>
        </footer>
    </div>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        const swiper = new Swiper('.swiper', {
            loop: true,
            pagination: {
                el: '.swiper-pagination',
                clickable: true,
            },
            navigation: {
                nextEl: '.swiper-button-next',
                prevEl: '.swiper-button-prev',
            },
        });
    </script>
    <script src="js/main.js"></script>
</body>
</html>
